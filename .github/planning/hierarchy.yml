schema_version: 1
organization: RABC-SAS
repository: bv-agile-framework

execution:
  approval_required_after_each_phase: true
  scripts:
    idempotent: true
    dry_run_required: true
  preserve_unmanaged_resources: true

issue_types:
  - Initiative
  - Epic
  - Feature
  - User Story
  - Bug Story
  - Task

# null means a standard GitHub issue with no assigned issue type, not "Issue".
leaf_issue_type: null
hierarchy:
  - parent: Initiative
    children: [Epic]
  - parent: Epic
    children: [Feature]
  - parent: Feature
    children: [User Story, Bug Story]
  - parent: User Story
    children: [Task, null]
  - parent: Bug Story
    children: [Task, null]

fields:
  acceptance_criteria:
    name: Acceptance Criteria
    required_on: [Initiative, Epic, Feature, User Story]
    storage: capability_gated
    native_type: text
    fallback_form_id: acceptance_criteria
    fallback_heading: Acceptance Criteria
  delivery_evidence:
    name: Delivery Evidence
    required_on: [Initiative, Epic, Feature, User Story]
    storage: capability_gated
    native_type: text
    fallback_form_id: delivery_evidence
    fallback_heading: Delivery Evidence
  cost_centre:
    name: Cost Centre
    native_type: text
    applies_to: [Initiative, Epic, Feature]
    required: false

field_storage:
  decision: issue_form_sections_and_validation_action
  native_pass_criteria:
    - api_preserves_newlines
    - ui_can_edit_multiple_lines
    - ui_renders_markdown_checklists_and_links
  fallback: issue_form_sections_and_validation_action
  description_form_id: description
  description_heading: Description

validation:
  # Forms only validate form submissions; an Action must also cover bypasses.
  required_content: non_whitespace_non_placeholder
  required_at: creation_and_edit
  enforce_allowed_parent_child_types: true
  untyped_issue_must_be_leaf: true
  terminal_types: [Task, null]
  report_only: true
  never_reparent_or_delete_automatically: true

smoke_test:
  project_owner: RABC-SAS
  project_number_candidate: 2
  project_title: Bigview Project Template Test
  require_live_identity_confirmation: true
  repository: RABC-SAS/bv-agile-framework
  marker: bv-agile-framework-smoke
  fixtures:
    - key: initiative
      type: Initiative
      parent: null
    - key: epic
      type: Epic
      parent: initiative
    - key: feature
      type: Feature
      parent: epic
    - key: user_story
      type: User Story
      parent: feature
    - key: story_task
      type: Task
      parent: user_story
    - key: story_issue
      type: null
      parent: user_story
    - key: bug_story
      type: Bug Story
      parent: feature
    - key: bug_task
      type: Task
      parent: bug_story
    - key: bug_issue
      type: null
      parent: bug_story
  negative_fixtures:
    - key: negative_missing_fields
      type: Initiative
      parent: null
      omit_required_fields: true
    - key: negative_invalid_task
      type: Task
      parent: negative_missing_fields
    - key: negative_invalid_issue
      type: null
      parent: negative_invalid_task
  cleanup: close_owned_fixtures_and_remove_owned_project_items
