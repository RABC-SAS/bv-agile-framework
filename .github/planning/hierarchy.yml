schema_version: 2
organization: RABC-SAS
repository: bv-agile-framework

project:
  owner: RABC-SAS
  number: 2
  title: Agile Project Config
  status_field: Status
  statuses: [Backlog, Ready, In progress, In review, Done]
  empty_status: Backlog

issue_types:
  - Initiative
  - Epic
  - Feature
  - User Story
  - Bug Story
  - Task

# null means a standard GitHub issue with no assigned issue type, not "Issue".
leaf_issue_type: null
hierarchy:
  - parent: Initiative
    children: [Epic]
  - parent: Epic
    children: [Feature]
  - parent: Feature
    children: [User Story, Bug Story]
  - parent: User Story
    children: [Task, null]
  - parent: Bug Story
    children: [Task, null]

fields:
  acceptance_criteria:
    name: Acceptance Criteria
    storage: issue_body
    heading: Acceptance Criteria
    form_id: acceptance_criteria
    applies_to: [Initiative, Epic, Feature, User Story]
    required_on: [Initiative, Epic, Feature, User Story]
    required_from_status: Ready
  delivery_evidence:
    name: Delivery Evidence
    storage: issue_body
    heading: Delivery Evidence
    form_id: delivery_evidence
    applies_to: [Initiative, Epic, Feature, User Story]
    required_on: [Initiative, Epic, Feature, User Story]
    required_from_status: In review
  cost_centre:
    name: Cost Centre
    storage: organization_field
    data_type: text
    applies_to: [Initiative, Epic, Feature]
    required_on: []

forms:
  description_form_id: description
  description_heading: Description
  description_required: true

validation:
  mode: report_only
  placeholders: [TBD, TODO, N/A, NA, None, 'Null', Placeholder, No response, Not provided, Not applicable, To be defined, To be determined, To be added]
  enforce_allowed_parent_child_types: true
  terminal_types: [Task, null]
  check_field_applicability: true
  marker: '<!-- bv-agile-framework-validation:v1 -->'

smoke_test:
  marker: bv-agile-framework-smoke
  fixtures:
    - key: initiative
      type: Initiative
      parent: null
    - key: epic
      type: Epic
      parent: initiative
    - key: feature
      type: Feature
      parent: epic
    - key: user_story
      type: User Story
      parent: feature
    - key: bug_story
      type: Bug Story
      parent: feature
    - key: story_task
      type: Task
      parent: user_story
    - key: story_issue
      type: null
      parent: user_story
    - key: bug_task
      type: Task
      parent: bug_story
    - key: bug_issue
      type: null
      parent: bug_story
  cleanup: close_owned_fixtures_and_remove_owned_project_items
