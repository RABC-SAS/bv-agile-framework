name: Agile Policy

on:
  issues:
    types: [opened, edited, reopened, closed, typed, untyped, field_added, field_removed, transferred]
  repository_dispatch:
    types: [bv-agile-hierarchy-changed]
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: bv-agile-policy
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate every issue against current policy
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/agile.mjs validate --event "$GITHUB_EVENT_PATH" --manifest "$RUNNER_TEMP/bv-agile-framework/validation.json" "${args[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || false }}